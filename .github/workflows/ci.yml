name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

      - name: Run Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://logoloom.app

      - name: Run Vector PDF & QR Acceptance Tests
        run: npm run test:pdf

      - name: Run Translation Completeness & Quality Tests
        run: npm run test:i18n

      - name: Run 6-Language PDF Tests
        run: npm run test:languages

      - name: Run End-to-End Feature Tests
        run: npm run test:e2e
